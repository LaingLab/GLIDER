name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight CI for outdated commits on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  # Lint, format, type-check. Single platform, fastest interpreter — these
  # don't need to run on every OS × Python combo.
  # ------------------------------------------------------------------------
  lint:
    name: Lint + format + type-check
    # Skip the duplicate run when a PR is merged: the same commits already
    # passed CI on the pull_request event. Direct pushes to main are NOT
    # merges, so they still run -- that is the case worth keeping, since
    # nothing else tests them. A squash or rebase merge produces no
    # "Merge pull request" subject and so still runs, which is the safe
    # direction to fail: a redundant run, never a missing one.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request ')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install uv
        run: pip install uv

      - name: Install dev extras
        run: uv sync --extra dev

      # `plugins` covers the in-repo plugin distributions (glider-harp,
      # glider-maimu, glider-sleap, glider-dlc and any future sibling).
      # Before it was
      # listed here, the plugins' source and the `src = [...]` import-root
      # config in the root pyproject were only ever exercised on a developer's
      # machine.
      - name: Ruff
        run: uv run ruff check src tests plugins

      - name: Black --check
        run: uv run black --check src tests plugins

      - name: Mypy
        # Start permissive (ignore-missing-imports), tighten over time. Failing
        # mypy doesn't fail CI yet; it's surfaced for visibility.
        run: uv run mypy src || true

  # ------------------------------------------------------------------------
  # Unit + integration tests across the supported Python / OS matrix.
  # ------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    # Skip the duplicate run when a PR is merged: the same commits already
    # passed CI on the pull_request event. Direct pushes to main are NOT
    # merges, so they still run -- that is the case worth keeping, since
    # nothing else tests them. A squash or rebase merge produces no
    # "Merge pull request" subject and so still runs, which is the safe
    # direction to fail: a redundant run, never a missing one.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request ')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
        # Pinned to 3.11 for now to save Actions usage; restore the full
        # ["3.11", "3.12", "3.13"] matrix before release.
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 \
            ffmpeg

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install uv
        run: pip install uv

      - name: Install project + dev extras
        run: uv sync --extra dev

      # The in-repo plugin distributions. Editable, and after `uv sync`
      # (which prunes anything not in the lockfile), so this must stay last of
      # the install steps. This is also how `harp-protocol` reaches CI: it is
      # the plugin's declared dependency, not the core project's.
      #
      # Installing rather than extending PYTHONPATH is deliberate: PYTHONPATH's
      # separator is `;` on Windows and `:` elsewhere, and the workflow's `env:`
      # block is one literal string for all three runners -- a wrong separator
      # does not error, it just quietly imports nothing. An install has no such
      # edge, and it registers the entry points that
      # tests/test_packaging.py's PluginManager test exercises.
      - name: Install in-repo plugins (brings in harp-protocol)
        run: |
          uv pip install -e ./plugins/glider-harp
          uv pip install -e ./plugins/glider-maimu
          # --no-deps for glider-sleap: its dependency is TensorFlow, a
          # several-hundred-megabyte wheel downloaded on every job of a
          # nine-cell matrix to be imported by exactly one test, which
          # skips without it. What CI needs from this plugin is that it
          # registers through the glider.pose entry point and that its
          # path logic is right, and neither needs TF. The conversion
          # itself is verified by hand against a real SLEAP model.
          uv pip install -e ./plugins/glider-sleap --no-deps
          # glider-dlc has no dependencies of its own by design: it builds
          # a DeepLabCut environment at runtime rather than carrying one.
          uv pip install -e ./plugins/glider-dlc
          # glider-sleap-nn likewise. Note this is the opposite of
          # glider-sleap above, which needs --no-deps to keep TensorFlow out
          # of the matrix: there is nothing here to keep out.
          uv pip install -e ./plugins/glider-sleap-nn

      - name: Run tests with coverage
        # Force bash on all platforms: the default Windows shell is PowerShell,
        # which doesn't understand `\` line-continuation. GitHub-hosted Windows
        # runners ship bash, so this keeps one cross-platform command.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        # Exclude `slow` (timing-sensitive) tests: shared CI runners have too
        # much scheduling jitter for sub-100ms timing assertions. They still
        # run locally via `pytest -m slow`.
        # --cov-fail-under starts at today's coverage; ratchet upward on every
        # release. Producing a coverage report at all is the win — the floor
        # can move once the test sprint lands.
        # `--no-sync`: a bare `uv run` re-syncs the environment from uv.lock
        # first, which would uninstall the editable plugin installed above and
        # take harp-protocol with it. The paths are given explicitly rather
        # than relying on `testpaths` so the invocation stays readable, and
        # they match what `testpaths` in pyproject.toml lists.
        run: |
          uv run --no-sync pytest tests/ plugins/glider-harp/tests/ \
            plugins/glider-maimu/tests/ plugins/glider-sleap/tests/ \
            plugins/glider-dlc/tests/ plugins/glider-sleap-nn/tests/ \
            -v -m "not slow" \
            --cov=glider \
            --cov=glider_harp \
            --cov=glider_maimu \
            --cov=glider_sleap \
            --cov=glider_dlc \
            --cov=glider_sleap_nn \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage (Ubuntu / 3.11 only)
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
