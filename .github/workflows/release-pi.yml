# Tag-triggered Raspberry Pi SD image build.
#
# Uses pi-gen on a GitHub ARM runner to bake an image with GLIDER pre-
# installed and auto-starting in Runner mode. Outputs:
#
#   GLIDER-<version>-pi64.img.xz
#   os-list.json                  (rewritten with real size/sha256/url/date)
#
# Both are attached to the matching draft Release for a human to smoke-test
# before publishing.

name: release-pi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ARM runners build natively; x86 runners would need QEMU user-mode
    # emulation and take 2-3× as long. If ARM availability is a problem,
    # swap to ubuntu-22.04 and enable the qemu-user-static fallback in
    # pi-gen's config.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: glider
          fetch-depth: 0  # pi-gen's stage script checks out tags

      - name: Derive version from tag
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pi-gen build deps
        # Matches pi-gen's arm64-branch ./depends file. Two Ubuntu gotchas:
        #   1. qemu-user-binfmt and qemu-user-static conflict — they both
        #      register the same binfmt handlers. pi-gen's arm64 depends
        #      file explicitly names qemu-user-binfmt, so that's the one
        #      to install. Don't list qemu-user-static alongside it.
        #   2. binfmt-support provides the binfmt-registration machinery
        #      that qemu-user-binfmt plugs into.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-binfmt binfmt-support \
            qemu-utils debootstrap zerofree zip dosfstools libarchive-tools \
            libcap2-bin grep rsync xz-utils file git curl bc arch-test \
            kpartx gpg pigz fdisk wget

      - name: Install current Debian archive keyring
        # Ubuntu 22.04's debian-archive-keyring predates Debian 12 (bookworm).
        # debootstrap uses the HOST's keyring to seed the chroot, so without
        # this step the chroot's apt sees "NO_PUBKEY" on every bookworm
        # repo fetch (main, updates, security). Pull the current keyring
        # package from Debian's own pool and install it on the host.
        run: |
          # Resolve the latest versioned .deb in Debian's pool rather than
          # hardcoding a version (the keyring ships updates on its own
          # cadence — pinning a version would age out).
          KEYRING_URL=$(curl -sL http://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/ \
            | grep -oE 'debian-archive-keyring_[0-9.+deb~u]+_all\.deb' \
            | sort -V | tail -n1)
          echo "Fetching http://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/$KEYRING_URL"
          curl -sL -o /tmp/debian-archive-keyring.deb \
            "http://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/$KEYRING_URL"
          sudo dpkg -i /tmp/debian-archive-keyring.deb
          dpkg -l debian-archive-keyring | tail -1

      - name: Clone pi-gen
        run: git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git

      - name: Wire stage-glider into pi-gen
        run: |
          cp glider/packaging/pi/pi-gen-config pi-gen/config
          cp -r glider/packaging/pi/stage-glider pi-gen/
          chmod +x pi-gen/stage-glider/00-run.sh
          chmod +x pi-gen/stage-glider/files/glider-update.sh

      - name: Strip unavailable rpi-* packages from pi-gen stages
        # pi-gen's arm64 branch references rpi-swap, rpi-loop-utils, and
        # rpi-usb-gadget, but those aren't currently published to
        # archive.raspberrypi.com for bookworm arm64. The reference is
        # NOT in *-packages files (those are line-delimited package lists) —
        # it's embedded inline in stage2/01-sys-tweaks/00-packages (which
        # turned out to be a newer shell-script-style stage, not a list).
        # Strategy: do a broad grep for every occurrence of the three
        # package names across pi-gen/, then sed each matching file,
        # handling both whole-word boundaries and bare-line forms.
        run: |
          set -euo pipefail
          MISSING=(rpi-swap rpi-loop-utils rpi-usb-gadget)

          echo "=== Before patch: all occurrences of offending packages ==="
          grep -rn -E "\b(rpi-swap|rpi-loop-utils|rpi-usb-gadget)\b" pi-gen/ \
            || { echo "  (no matches anywhere in pi-gen/)"; exit 1; }

          echo
          echo "=== Applying patches ==="
          # Enumerate every file containing any of the three names. Use -l
          # to list unique filenames, then sed each one twice per package:
          # once for "bare line" form (for *-packages list files) and once
          # for whole-word inline form (for shell scripts that apt-install
          # them via a space-separated list).
          FILES=$(grep -rlE "\b(rpi-swap|rpi-loop-utils|rpi-usb-gadget)\b" pi-gen/ \
                  || true)
          if [ -z "$FILES" ]; then
            echo "  nothing to patch"
            exit 1
          fi
          for f in $FILES; do
            echo "  patching $f"
            for pkg in "${MISSING[@]}"; do
              # (1) Delete the exact bare-line form (list files)
              sed -i "/^${pkg}\$/d" "$f"
              # (2) Remove the word from any in-line shell list — leaving
              # the surrounding command intact. The word-boundary regex
              # plus an optional trailing space keeps argv spacing sane.
              sed -i -E "s/\b${pkg}\b ?//g" "$f"
            done
          done

          echo
          echo "=== After patch: re-check ==="
          if grep -rn -E "\b(rpi-swap|rpi-loop-utils|rpi-usb-gadget)\b" pi-gen/; then
            echo "ERROR: offending packages still present after patch"
            exit 1
          else
            echo "  clean — all three scrubbed"
          fi

      - name: Neutralize missing rpi-resize.service enable
        # pi-gen's stage2/01-sys-tweaks/01-run.sh runs
        #     systemctl enable rpi-resize.service
        # inside the chroot, but the service file isn't present in the
        # current bookworm/arm64 package set (likely pulled by a meta
        # package that isn't published, same class of drift as the
        # rpi-swap/loop-utils/usb-gadget issue). Pi Imager already does
        # first-boot partition expansion itself during flashing, so the
        # service is cosmetic here. Patch the enable command to tolerate
        # missing units (`|| true`) instead of trying to install a package
        # we don't have.
        run: |
          set -euo pipefail
          echo "=== Before patch: rpi-resize occurrences ==="
          grep -rn "rpi-resize" pi-gen/ || echo "  (not found)"

          FILES=$(grep -rlE "systemctl[[:space:]]+enable[[:space:]]+rpi-resize" pi-gen/ \
                  || true)
          if [ -z "$FILES" ]; then
            echo "  nothing to patch (may be a different failure mode)"
          else
            for f in $FILES; do
              echo "  patching $f"
              # Replace the bare systemctl enable with a soft-fail wrapper.
              sed -i -E "s@(systemctl[[:space:]]+enable[[:space:]]+rpi-resize[^[:space:]]*)@\1 || true@g" "$f"
            done
          fi

          echo
          echo "=== After patch: rpi-resize occurrences ==="
          grep -rn "rpi-resize" pi-gen/ || true

      - name: Inject fresh keyring into stage0's chroot
        # Symptom without this: stage0/00-configure-apt fails with NO_PUBKEY
        # on bookworm-updates/bookworm-security, because the chroot's own
        # debian-archive-keyring (installed by debootstrap) predates those
        # keys. Patching stage0/prerun.sh is the smallest-surface fix:
        # debootstrap runs as the last line of prerun.sh, so appending our
        # dpkg -i after it means the chroot has current keys before any
        # downstream sub-stage runs `apt-get update`.
        run: |
          cat >> pi-gen/stage0/prerun.sh <<'KEYRING_FIX'

          # --- GLIDER CI workaround: refresh debian-archive-keyring in chroot ---
          if [ -f /tmp/debian-archive-keyring.deb ] && [ -d "${ROOTFS_DIR}/tmp" ]; then
              cp /tmp/debian-archive-keyring.deb "${ROOTFS_DIR}/tmp/glider-keyring.deb"
              chroot "${ROOTFS_DIR}" dpkg -i /tmp/glider-keyring.deb
              rm -f "${ROOTFS_DIR}/tmp/glider-keyring.deb"
          fi
          # --- end workaround ---
          KEYRING_FIX
          echo "Patched pi-gen/stage0/prerun.sh:"
          tail -n 12 pi-gen/stage0/prerun.sh

      - name: Build image
        working-directory: pi-gen
        env:
          GLIDER_REF: ${{ steps.version.outputs.ref }}
        run: |
          # Skip NOOBS packaging (not needed for Pi Imager distribution) and
          # docker-ise nothing — we're already in a disposable runner.
          sudo -E ./build.sh

      - name: Compress image
        working-directory: pi-gen/deploy
        run: |
          # pi-gen already outputs a .zip — also produce .img.xz because the
          # Pi Imager manifest prefers xz (better compression for OS images).
          for img in *.img; do
            xz --threads=0 -9 --keep "$img"
          done
          ls -lh

      - name: Rename artifacts
        working-directory: pi-gen/deploy
        run: |
          V="${{ steps.version.outputs.version }}"
          for f in *.img.xz; do
            mv "$f" "GLIDER-${V}-pi64.img.xz"
          done

      - name: Rewrite os-list.json with real sizes and checksums
        working-directory: pi-gen/deploy
        run: |
          V="${{ steps.version.outputs.version }}"
          IMG="GLIDER-${V}-pi64.img.xz"
          SIZE=$(stat -c%s "$IMG")
          SHA=$(sha256sum "$IMG" | awk '{print $1}')
          # extract_size = uncompressed image size
          UNCOMPRESSED_IMG=$(ls *.img | head -n1 || true)
          if [[ -n "$UNCOMPRESSED_IMG" ]]; then
            EXTRACT_SIZE=$(stat -c%s "$UNCOMPRESSED_IMG")
            EXTRACT_SHA=$(sha256sum "$UNCOMPRESSED_IMG" | awk '{print $1}')
          else
            EXTRACT_SIZE=0
            EXTRACT_SHA="unavailable"
          fi
          DATE=$(date -u +%Y-%m-%d)

          cp ../../glider/packaging/pi/os-list.json ./os-list.json
          python3 - <<EOF
          import json, pathlib
          p = pathlib.Path("os-list.json")
          data = json.loads(p.read_text())
          entry = data["os_list"][0]
          entry["url"] = entry["url"].replace("__VERSION__", "${V}")
          entry["image_download_size"] = int("${SIZE}")
          entry["image_download_sha256"] = "${SHA}"
          entry["extract_size"] = int("${EXTRACT_SIZE}")
          entry["extract_sha256"] = "${EXTRACT_SHA}"
          entry["release_date"] = "${DATE}"
          p.write_text(json.dumps(data, indent=2))
          EOF
          cat os-list.json

      - name: Upload artifacts (manual workflow_dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GLIDER-${{ steps.version.outputs.version }}-pi64
          path: |
            pi-gen/deploy/GLIDER-*-pi64.img.xz
            pi-gen/deploy/os-list.json
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pi-gen/deploy/GLIDER-*-pi64.img.xz
            pi-gen/deploy/os-list.json
          fail_on_unmatched_files: true
          draft: true
