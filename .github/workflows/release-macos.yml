# Tag-triggered macOS build.
#
# Fires on push of any `v*` tag and produces (currently unsigned, un-notarized)
# `GLIDER-<version>-<arch>.dmg` files attached to the matching GitHub Release —
# one per architecture (Apple Silicon + Intel). Also runnable manually via
# workflow_dispatch, which uploads the DMGs as downloadable artifacts instead.
#
# Tag format MUST be `vX.Y.Z`.

name: release-macos

on:
  push:
    tags:
      - "v*"
  # Allow manual runs during iteration; useful for testing spec changes
  # without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write  # needed for softprops/action-gh-release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14   # Apple Silicon
            arch: arm64
          - os: macos-13   # Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install project (pc + dev extras)
        run: uv sync --extra pc --extra dev

      - name: Derive version from tag
        id: version
        run: |
          # strip the leading 'v' from the tag, or fall back to 0.0.0-dev
          ref="${{ github.ref_name }}"
          if [[ "$ref" =~ ^v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Freeze with PyInstaller
        run: uv run pyinstaller packaging/macos/glider.spec --clean --noconfirm

      - name: Smoke-test the frozen app
        # --version exits inside argparse, before any Qt/window init, so this
        # runs headless on CI. Mirrors the Windows/CI `--version` assertion.
        run: |
          dist/GLIDER.app/Contents/MacOS/GLIDER --version

      - name: Package .dmg
        id: dmg
        run: |
          version="${{ steps.version.outputs.version }}"
          arch="${{ matrix.arch }}"
          dmg="GLIDER-${version}-${arch}.dmg"
          staging="$(mktemp -d)"
          cp -R "dist/GLIDER.app" "$staging/"
          # Drag-to-install target: users drop GLIDER.app onto Applications.
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "GLIDER ${version}" \
            -srcfolder "$staging" -ov -format UDZO "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          ls -lh "$dmg"

      # --- CODE SIGNING / NOTARIZATION TODO ----------------------------------
      # The DMG ships unsigned and un-notarized for now. Every downloader will
      # hit Gatekeeper's "GLIDER can't be opened because Apple cannot check it
      # for malicious software" — they must right-click → Open (or run
      # `xattr -dr com.apple.quarantine /Applications/GLIDER.app`) once.
      #
      # When ready (needs an Apple Developer ID, ~$99/yr):
      #   1. Import the Developer ID Application cert into a temp keychain from
      #      ${{ secrets.APPLE_CERT_P12_BASE64 }} / APPLE_CERT_PASSWORD.
      #   2. codesign --deep --force --options runtime --timestamp \
      #        --sign "Developer ID Application: <Team>" dist/GLIDER.app
      #   3. Build the DMG (above), then notarize + staple:
      #        xcrun notarytool submit "$dmg" --apple-id ... --team-id ... \
      #          --password ... --wait
      #        xcrun stapler staple "$dmg"
      # -----------------------------------------------------------------------

      - name: Upload DMG artifact (for manual workflow_dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GLIDER-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg }}
          fail_on_unmatched_files: true
          draft: true   # reviewer publishes manually after a smoke test
