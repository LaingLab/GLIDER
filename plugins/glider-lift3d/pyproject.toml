[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glider-lift3d"
version = "0.1.0"
description = "Mouse 3-D posture from one top-down camera, for GLIDER: lift, back-arch curvature, Session Review panels"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [
    {name = "LaingLab"}
]
keywords = ["glider", "pose", "3d", "posture", "pain", "mouse"]
classifiers = [
    # Alpha: estimates, not measurements. Held-out rear F1 0.66; the back-arch
    # measure has not been validated against side-view ground truth.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # GLIDER itself (PyQt6, pyqtgraph, numpy, OpenCV, Ultralytics) is the host
    # application, not a dependency: depending on it would make the two versions
    # fight at install time, as for glider-maimu. The depth model additionally
    # needs ultralytics>=8.4.192; without it the lift runs on the mask and
    # keypoints alone.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
]

# Session Review discovers panels through this group (glider.gui.review.extensions).
[project.entry-points."glider.review_panel"]
lift3d = "glider_lift3d.review:panels"

[project.entry-points."glider.range_metrics"]
lift3d = "glider_lift3d.metrics:provider"

[project.scripts]
glider-lift3d = "glider_lift3d.batch:main"

[project.urls]
Homepage = "https://github.com/LaingLab/glider"
Repository = "https://github.com/LaingLab/glider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
