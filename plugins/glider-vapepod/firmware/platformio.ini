; PlatformIO build for the ESP32 version of the VapePod firmware
; (vapepod_esp32/). It also opens as-is in the Arduino IDE (board "ESP32 Dev
; Module"). The XIAO nRF52840 sketch the pod is built with (vapepod/) builds in
; the Arduino IDE only: see ../README.md.
;
;   pio run -t upload        build and flash
;   pio device monitor       serial log at 115200

[platformio]
src_dir = vapepod_esp32

[env:esp32dev]
; 6.9.0 bundles the ESP32 Arduino core 2.0.17. The sketch builds on core 3.x
; as well, but not on core 4, which replaced the BLE API.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
