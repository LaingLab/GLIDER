[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GLIDER"
dynamic = ["version"]
description = "General Laboratory Interface for Design, Experimentation, and Recording"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"
authors = [
    {name = "LaingLab"}
]
keywords = ["laboratory", "automation", "hardware", "orchestration", "experiment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "qasync>=0.24.0",
    "telemetrix-aio>=1.0.0",  # TODO: could be moved to an [arduino] optional group in the future
    "pyserial>=3.5",
    "jsonschema>=4.0.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.21.0",
    "opencv-python>=4.8.0",  # TODO: could be moved to [vision] optional group in the future
    "scipy>=1.10.0",
    "httpx>=0.24.0",
    "packaging>=21.0",  # version comparison in the in-app updater
    "ryvencore>=0.4.0",
    "pandas>=2.0.0",
    "bleak>=0.21.0",  # Bluetooth LE (async, cross-platform: WinRT/CoreBluetooth/BlueZ)
    # PyQt6 is intentionally absent from core: Raspberry Pi uses system-installed PyQt6
    # (sudo apt install python3-pyqt6). PC installs use the [pc] optional group.
]

[project.optional-dependencies]
rpi = [
    "gpiozero>=2.0",
    "lgpio>=0.2.0",
]
vision = [
    "ultralytics>=8.0.0",
    # ByteTrack (model.track(tracker="bytetrack.yaml")) needs `lap` for linear
    # assignment. Ultralytics doesn't declare it because they treat it as
    # opt-in, and they shell out to `pip install` at runtime when it's missing
    # — which fails noisily in any environment where `pip` isn't on PATH
    # (frozen builds, some Pi venvs). Pinning it here means it's installed
    # up front and we never hit the AutoUpdate path.
    "lap>=0.5.12",
]
audio = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
]
i2c = [
    "adafruit-circuitpython-ads1x15",
    # Generic register-level I2C (smbus2). Pure-Python but imports `fcntl`, so it
    # is Linux/Pi-only at runtime — GenericI2CDevice lazy-imports it inside
    # initialize(), so non-Linux dev installs are unaffected (it is never imported
    # there). Installs fine on every OS for `uv sync`.
    "smbus2>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyinstaller>=6.19.0",
    # Pull the full PC + ML + I2C surface for development so dev installs can
    # exercise every code path without remembering individual extras.
    "GLIDER[pc,vision,i2c]",
]
pc = [
    "PyQt6>=6.4.0",
    "GLIDER[audio]",
]

[project.scripts]
glider = "glider.__main__:main"

[project.entry-points."glider.driver"]
# Built-in drivers are registered here
arduino = "glider.hal.boards.telemetrix_board:TelemetrixBoard"
raspberry_pi = "glider.hal.boards.pi_gpio_board:PiGPIOBoard"
bluetooth = "glider.hal.boards.ble_board:BLEBoard"

[project.urls]
Homepage = "https://github.com/LaingLab/glider"
Documentation = "https://github.com/LaingLab/glider#readme"
Repository = "https://github.com/LaingLab/glider"

[tool.setuptools.dynamic]
# Version is sourced from src/glider/_version.py — the sole place to bump on release.
version = {attr = "glider._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glider = ["schema/*.json", "gui/styles/*.qss", "assets/*.png"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "hardware: marks tests requiring real hardware (deselect with -m 'not hardware')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N802",  # function name should be lowercase (Qt method overrides use camelCase)
    "N812",  # lowercase imported as non-lowercase (intentional for hardware libraries)
    "B027",  # empty method in ABC without abstract decorator (intentional for optional overrides)
]

[tool.ruff.lint.per-file-ignores]
# Hardware abstraction files use imports for availability checking
"src/glider/hal/boards/*.py" = ["F401"]
"src/glider/hal/base_device.py" = ["F401"]
